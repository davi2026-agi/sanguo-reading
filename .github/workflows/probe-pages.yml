name: Probe Pages API

on:
  push:
    paths:
      - '.github/workflows/probe-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call Pages API and record response
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o body.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"source":{"branch":"main","path":"/"},"build_type":"legacy"}' \
            "https://api.github.com/repos/${{ github.repository }}/pages") || code=000
          { echo "HTTP_CODE=$code"; echo "--- body ---"; cat body.json; echo; echo "--- headers probe ---"; curl -sS -o /dev/null -w 'GET_pages=%{http_code}\n' -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages"; } > pages_api_log.txt
          cat pages_api_log.txt
      - name: Commit log
        run: |
          git config user.name "davi2026-agi"
          git config user.email "dyy022@163.com"
          git add pages_api_log.txt
          git commit -m "log: pages api probe result" || echo "nothing to commit"
          git push || echo "push failed"
